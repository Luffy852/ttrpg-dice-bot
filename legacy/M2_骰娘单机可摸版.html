<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content：Chrome/Android 上键盘弹出时压缩视口而非遮盖内容。
     不支持的浏览器（iOS Safari、WebView）由下面 visualViewport 兜底。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>骰娘 M2 · 单机可摸版</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e3e6ea; --tx:#1f2328; --tx2:#6b7280; --tx3:#9aa2ad;
  --accent:#4f46e5; --ok:#15803d; --okbg:#e7f6ed; --no:#b91c1c; --nobg:#fdecec;
  --warn:#b45309; --warnbg:#fff5e6; --warnline:#f3d9a6;
  --chipbg:#f1f3f6; --chipline:#d5dae0; --codebg:#f6f7f9;
  --fs:14px; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--tx);font:var(--fs)/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
/* 高度优先级：visualViewport 实测值（键盘弹出时最准）> dvh > 100%。
   ★ 只用 100dvh 在键盘弹出时无效 —— 键盘不改变 layout viewport，输入区会被盖住。 */
#app{height:100%;height:100dvh;height:var(--app-h,100dvh);
  display:flex;flex-direction:column;position:relative;top:var(--vv-top,0px)}

/* ---------- 顶栏（固定，不参与滚动） ---------- */
#topbar{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px}
#topbar .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#topbar .title{font-weight:700;font-size:14px}
#topbar .spacer{flex:1 1 auto}
.pill{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--codebg);border:1px solid var(--line);color:var(--tx2);white-space:nowrap}
.pill.on{background:#eef2ff;border-color:#dfe3ff;color:#4338ca}
.pill.me{background:#e7f6ed;border-color:#cdebd8;color:var(--ok)}
#topbar .r2{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;padding-bottom:2px}
.quick{flex:0 0 auto;font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--tx2);cursor:pointer}
.quick:active{background:#eef2ff;color:#4338ca}

/* ---------- 消息流 ---------- */
#stream{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:7px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.av{flex:0 0 26px;height:26px;border-radius:8px;background:#e8eaee;color:#4b5563;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.me .av{background:#dbeafe;color:#1d4ed8}
.body{flex:1 1 auto;min-width:0}
.msg.me .body{display:flex;flex-direction:column;align-items:flex-end}
.msg.me .who{flex-direction:row-reverse}
.who{font-size:11.5px;color:var(--tx2);margin-bottom:2px;display:flex;gap:6px;align-items:baseline}
.who .ts{color:var(--tx3);font-size:11px}
.bubble{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:9px 11px;overflow-wrap:anywhere;word-break:break-word}
.msg.me .bubble{background:#eff6ff;border-color:#dbeafe}
.bubble.cmd{font-family:ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;font-size:13px;background:#eef2ff;border-color:#dfe3ff;color:#3730a3;word-break:break-all}
.bubble.dice{background:#fcfcfe;padding:7px 10px;cursor:pointer;user-select:none}
.bubble.rule-dnd5e,.bubble.rule-dnd5r{border-left:3px solid #6366f1}
.bubble.rule-generic{border-left:3px solid #9aa3af}
.bubble pre{margin:0;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;white-space:pre-wrap}

/* ---------- 结构化说明（帮助 / 状态 / 技能表）：指令与说明分栏 ---------- */
.ht{font-weight:800;font-size:13.5px;margin-bottom:7px}
.hs{margin-top:9px}
.hh{font-size:12px;font-weight:700;color:#4338ca;background:#eef2ff;border-radius:5px;padding:2px 7px;display:inline-block;margin-bottom:4px}
.hrow{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:3px 12px;align-items:baseline;padding:1.5px 0}
/* 长指令一律换行，不做横向滚动 —— 手机上横滑容易误触，且用户看不到后面还有内容 */
.hk{font-family:ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;font-size:12px;color:#3730a3;
  background:#f1f3f9;border:1px solid #e0e4ee;border-radius:4px;padding:0 5px;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;max-width:100%}
.hv{font-size:12.5px;color:#4b5563;overflow-wrap:anywhere}
.hf{margin-top:9px;padding-top:7px;border-top:1px dashed var(--line);font-size:12px;color:var(--tx2)}
/* 窄屏：指令独占一行（带底色），说明缩进另起一行 —— 不会粘连混淆 */
@media (max-width:560px){
  .hrow{grid-template-columns:minmax(0,1fr);gap:2px;padding:3px 0}
  .hk{justify-self:start}
  .hv{padding-left:2px}
}
/* ---------- 角色卡栅格 ---------- */
.card{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:7px 0}
.card .cell{background:#f7f8fa;border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:12.5px;white-space:nowrap}
.card .ck{color:var(--tx2);font-size:11px;font-weight:700}
.card .cv{font-weight:700}
.card .cm{color:#4338ca;font-size:11.5px}
@media (max-width:400px){ .card{grid-template-columns:repeat(2,minmax(0,1fr))} }
.stline{font-size:12.5px;color:#374151}

/* ---------- 骰点气泡（C 方案：折叠式） ---------- */
.row1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.caret{flex:0 0 12px;color:var(--tx3);font-size:9px;transition:transform .12s}
.bubble.open .caret{transform:rotate(90deg)}
.ttl{font-weight:600}
.mode{font-size:11px;color:#6d28d9;background:#f3efff;border:1px solid #e2d9ff;border-radius:4px;padding:0 5px}
.chips{display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 4px;border:1px solid var(--chipline);background:var(--chipbg);border-radius:5px;font-size:12px;font-weight:700}
.chip.drop{color:#aab0b8;background:#fafbfc;text-decoration:line-through}
.chip.crit{background:#fff3cd;border-color:#eec06b;color:#8a5a00}
.sep{color:#c8cdd4;margin:0 1px;font-size:12px}
/* 骰点前缀标签：百分骰的"十位/个位"、二元骰的"希望/恐惧"、物语的"DEX/INS"
—— 折叠态一行里也要能分清哪颗是哪颗，否则 [8][3]·[6] 会被读成 83 和 6 */
.plab{font-size:10px;color:var(--tx3);margin-right:2px}
.sum{margin-left:auto;font-weight:800;white-space:nowrap}
.badge{font-size:11.5px;border-radius:5px;padding:1px 6px;font-weight:700}
.badge.ok{color:var(--ok);background:var(--okbg)}
.badge.no{color:var(--no);background:var(--nobg)}
.badge.mid{color:var(--warn);background:var(--warnbg)}
.badge.crit{color:#8a5a00;background:#fff7e0;border:1px solid #f0d9a0}
.badge.critfail{color:#8a1c1c;background:#fdeaea;border:1px solid #f0b4b4}
.detail{display:none;margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);font-size:12.5px;color:#374151}
.bubble.open .detail{display:block}
.dline{display:flex;align-items:center;gap:6px;padding:2px 0}
.dline .idx{color:var(--tx2);width:36px;flex:0 0 36px;font-size:11.5px}
.dline .tail{margin-left:auto;color:var(--tx2);font-size:11.5px}
.dline.use{font-weight:700}
.dline.comp{color:#374151}
.dline.comp .idx{color:var(--tx3)}
.dline.nat{color:#8a5a00;font-size:11.5px;line-height:1.5}
.dline.tot{margin-top:4px;padding-top:5px;border-top:1px solid var(--line);font-weight:700}
.note{font-size:11.5px;color:var(--tx2);margin-top:6px;line-height:1.5}
.note b{color:#374151}

/* ---------- 系统 / 提示 ---------- */
.sys{align-self:stretch;background:var(--warnbg);border:1px solid var(--warnline);border-radius:var(--radius);padding:9px 11px}
.sys .h{font-size:13px;font-weight:800;color:var(--warn)}
.sys .b1{font-size:14px;font-weight:700;margin:4px 0 2px}
.sys .b2{font-size:12px;color:#7c4a06}
.notice{align-self:stretch;background:#f8f9fb;border:1px dashed var(--line);border-radius:var(--radius);padding:8px 10px;font-size:12.5px;color:var(--tx2)}
.notice b{color:#374151}
.sysline{align-self:stretch;text-align:center;font-size:11.5px;color:var(--tx3);padding:2px 0}

/* ---------- 输入区 ---------- */
#composer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
#composer .row{display:flex;gap:8px;align-items:center}
#input{flex:1 1 auto;min-width:0;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--tx)}
#input:focus{outline:2px solid #c7d2fe;outline-offset:-1px;border-color:var(--accent)}
#send{flex:0 0 auto;font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
#send:active{opacity:.85}
#composer .tip{margin-top:5px;font-size:11.5px;color:var(--tx3)}
@media (max-width:360px){ .sum{margin-left:0} }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="r1">
      <span class="title">🎲 骰娘 M2 · 单机可摸版</span>
      <span class="pill" id="p-rule">通用</span>
      <span class="pill me" id="p-me">玩家</span>
      <span class="pill" id="p-bd">裸骰 关</span>
      <span class="spacer"></span>
      <span class="pill" id="p-cnt">0 条</span>
    </div>
    <div class="r2">
      <button class="quick" data-cmd=".help">.help</button>
      <button class="quick" data-cmd=".status">.status</button>
      <button class="quick" data-cmd=".st">.st</button>
      <button class="quick" data-cmd=".rc list">.rc list</button>
      <button class="quick" data-cmd=".set rule coc">.set rule coc</button>
      <button class="quick" data-cmd=".h">.h</button>
      <button class="quick" data-cmd=".set baredice on">.set baredice on</button>
    </div>
  </header>

  <main id="stream"></main>

  <footer id="composer">
    <div class="row">
      <input id="input" autocomplete="off" placeholder=".r 2d6+3　或　.help" enterkeyhint="send">
      <button id="send">发送</button>
    </div>
    <div class="tip"><b>.help</b> 看全部指令 · 中英文都认</div>
  </footer>
</div>

<script>
/* ==================================================================
 * ENGINE-START
 * 纯逻辑、零 DOM 依赖。M3 直接抽为 packages/engine，浏览器与 Worker 共用。
 * 边界：本区内不得出现 document / window / localStorage。
 * ================================================================== */

/* ---------- 1. rng.js：均匀随机源（拒绝采样，消除取模偏差） ---------- */
const RNG = (() => {
  function randBelow(n){
    if(!(n > 1)) return 0;
    const bits = Math.ceil(Math.log2(n));
    const mask = bits >= 32 ? 0xFFFFFFFF : ((1 << bits) - 1);
    const buf = new Uint32Array(1);
    for(;;){
      crypto.getRandomValues(buf);
      const v = buf[0] & mask;          // 取低 bits 位，均匀
      if(v < n) return v;               // 越界重取，保证严格均匀
    }
  }
  return { randBelow, die: sides => randBelow(sides) + 1 };
})();

/* ---------- 1.5 alias.js：统一别名层 ★ 所有"名字 → 规范键"都走这里 ----------
 * 为什么单独抽一层：别名一开始只做在技能上（18 项），属性没有中文别名 →
 * `.rc 力量` 无法识别。根子是「别名散落在各模块里各写各的」，加新域就要再抄一遍。
 * 现在：一个注册表 + 一个归一化 + 一个冲突检测，任何"用户输入的名字"都查它。
 *
 * 覆盖域：verb 动词 / rule 规则 / check 检定目标（属性+技能）/ mode 优劣势
 *        switch 开关值 / prof 熟练标记 / cardkey 角色卡字段
 * 不同域的同名词互不冲突（.st 是动词，st 不是属性），所以按域分桶。
 */
function normToken(s){
  if(s == null) return '';
  // NFKC：全角字母/数字/句点 → 半角；再小写、去空格与下划线。保留点号（5.5e ≠ 5e）
  return String(s).normalize('NFKC').trim().toLowerCase().replace(/[\s_]/g, '');
}
const ALIAS = {byDomain:new Map(), conflicts:[]};

function registerAliases(domain, entries){
  let map = ALIAS.byDomain.get(domain);
  if(!map){ map = new Map(); ALIAS.byDomain.set(domain, map); }
  entries.forEach(e => {
    (e.aliases || []).forEach(a => {
      const k = normToken(a);
      if(!k) return;
      const prev = map.get(k);
      if(prev && prev.key !== e.key){
        // 先到先得，冲突登记在案（不静默覆盖，否则后注册的会悄悄抢走前面的键）
        ALIAS.conflicts.push({domain, alias:a, keys:[prev.key, e.key]});
        return;
      }
      map.set(k, e);
    });
  });
}
function lookupAlias(domain, raw){
  const k = normToken(raw);
  if(!k) return null;
  const map = ALIAS.byDomain.get(domain);
  return map ? (map.get(k) || null) : null;
}
// ★ 新增别名前的冲突自查（只报告不注册）。返回 [] 才安全 —— 别名表是静态数据，
//   最大的坑就是新增时撞上已有键（inti / int 那一类）。
function detectConflicts(domain, entries){
  const map = ALIAS.byDomain.get(domain) || new Map();
  const out = [];
  entries.forEach(e => (e.aliases || []).forEach(a => {
    const k = normToken(a);
    const prev = map.get(k);
    if(prev && prev.key !== e.key) out.push({domain, alias:a, keys:[prev.key, e.key]});
  }));
  return out;
}
function sortedChars(s){ return Array.from(s).sort().join(''); }
function editDistance(a, b){
  if(a === b) return 0;
  const A = Array.from(a), B = Array.from(b);
  if(Math.abs(A.length - B.length) > 1) return 99;
  const dp = [];
  for(let i = 0; i <= A.length; i++){ dp.push(new Array(B.length + 1).fill(0)); dp[i][0] = i; }
  for(let j = 0; j <= B.length; j++) dp[0][j] = j;
  for(let i = 1; i <= A.length; i++)
    for(let j = 1; j <= B.length; j++)
      dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (A[i-1] === B[j-1] ? 0 : 1));
  return dp[A.length][B.length];
}
// 未识别时给建议：字序颠倒优先（察觉/觉察），其次编辑距离 ≤1
function suggestAlias(domain, raw, limit){
  const k = normToken(raw);
  if(!k) return [];
  const map = ALIAS.byDomain.get(domain);
  if(!map) return [];
  const cands = [];
  map.forEach((e, ak) => {
    if(ak === k) return;
    const name = e.display || e.key;
    if(sortedChars(ak) === sortedChars(k)){ cands.push({d:0, name}); return; }  // 字序颠倒：觉察 ↔ 察觉
    // 编辑距离仅对 3 字以上启用：2 字中文改一字往往就是另一个词
    // （"游泳"→"游说" 距离 1 却毫无关系），宁可不建议也不乱指路
    if(ak.length >= 3 || k.length >= 3){
      const d = editDistance(ak, k);
      if(d <= 1) cands.push({d, name});
    }
  });
  cands.sort((x, y) => x.d - y.d);
  const seen = new Set();
  return cands.filter(c => seen.has(c.name) ? false : (seen.add(c.name), true)).slice(0, limit || 2).map(c => c.name);
}

/* ---------- 2. rules.js：规则别名（保留点号，精确 Map 匹配） ---------- */
const RULE_META = {
  generic:{name:'通用',       short:'通用'},
  dnd5e :{name:'D&D 5e',      short:'D&D 5e'},
  dnd5r :{name:'D&D 5.5e (2024)', short:'D&D 5.5e'},
  coc7  :{name:'COC 7th',     short:'COC'},
  dh    :{name:'匕首心',       short:'匕首心'},
  fu    :{name:'最终物语',     short:'最终物语'}
};
registerAliases('rule', [
  {key:'generic', display:'通用',     aliases:['generic','通用','ge','gen','general','none','无','无规则','通用规则']},
  {key:'dnd5e',   display:'D&D 5e',   aliases:['dnd','dnd5e','5e','dnd5','龙与地下城','龙与地下城5e','龙与地下城五版','5版']},
  {key:'dnd5r',   display:'D&D 5.5e', aliases:['dnd5.5e','5.5e','dnd5r','5r','dnd2024','dnd5e2024','2024','龙与地下城2024','龙与地下城5.5','5.5版','2024版']},
  {key:'coc7',    display:'COC 7th',  aliases:['coc','coc7','coc7th','克苏鲁','克苏鲁的呼唤','克苏鲁呼唤','呼唤','7版','七版']},
  {key:'dh',      display:'匕首心',    aliases:['dh','daggerheart','匕首心','匕心','匕首']},
  {key:'fu',      display:'最终物语',  aliases:['fu','最终物语','fabula','fabulaultima','fabula ultima']}
]);

function normalizeRule(raw){
  const e = lookupAlias('rule', raw);
  return e ? e.key : null;
}
// 规则族：决定角色卡是否可用（5e 与 5.5e 卡结构相同，属同一族）
function ruleFamily(k){ return (k === 'dnd5e' || k === 'dnd5r') ? 'dnd' : (k === 'generic' ? null : k); }
// M2：四族六规则全部实现（generic / dnd5e / dnd5r / coc7 / dh / fu）
const IMPLEMENTED = new Set(['generic','dnd5e','dnd5r','coc7','dh','fu']);

/* ---------- 3. parse.js：掷骰表达式 ---------- */
const LIMITS = { perGroupDice:100, perGroupSides:10000, totalDice:500 };
const ITEM_RE = /([+-])?(?:(\d*)d(\d+)|(\d+))/gi;

function parseExpr(src){
  const s = String(src == null ? '' : src).replace(/\s+/g,'').toLowerCase();
  if(!s) return {ok:false, reason:'syntax'};
  const groups = []; let mod = 0, idx = 0, m;
  ITEM_RE.lastIndex = 0;
  while((m = ITEM_RE.exec(s)) !== null){
    if(m.index !== idx) return {ok:false, reason:'syntax'};   // 出现括号/乘除/k/dl/# 等
    idx = m.index + m[0].length;
    const sign = m[1] === '-' ? -1 : 1;
    if(m[3] !== undefined){
      const n = m[2] === '' ? 1 : parseInt(m[2], 10);
      groups.push({kind:'dice', n, sides:parseInt(m[3], 10), sign});
    } else {
      mod += parseInt(m[4], 10) * sign;
    }
  }
  if(idx !== s.length || groups.length === 0) return {ok:false, reason:'syntax'};
  let totalDice = 0;
  for(const g of groups){
    if(!(g.n >= 1)) return {ok:false, reason:'syntax'};
    if(g.sign < 0) return {ok:false, reason:'syntax'};   // 负骰数无意义（-1d6 会被当成 -1 颗骰）
    if(g.n > LIMITS.perGroupDice)   return {ok:false, reason:'limit'};
    if(g.sides < 1) return {ok:false, reason:'syntax'};
    if(g.sides > LIMITS.perGroupSides) return {ok:false, reason:'limit'};
    totalDice += g.n;
  }
  if(totalDice > LIMITS.totalDice) return {ok:false, reason:'limit'};
  return {ok:true, groups, mod, totalDice};
}

/* ---------- 4. roll.js：掷骰执行（优劣势按规则收敛） ---------- */
function rollOnce(g){ const a = []; for(let i = 0; i < g.n; i++) a.push(RNG.die(g.sides)); return a; }
function sumArr(a){ return a.reduce((x, y) => x + y, 0); }

// mode: 'adv' | 'dis' | null
function rollGroups(groups, mode, ruleKey){
  const dnd = (ruleKey === 'dnd5e' || ruleKey === 'dnd5r');
  const out = groups.map(g => ({n:g.n, sides:g.sides, sign:g.sign, tries:[], kept:[], keptIdx:0}));
  if(!mode){
    out.forEach(g => { g.tries = [rollOnce(g)]; g.kept = g.tries[0]; g.keptIdx = 0; });
    return out;
  }
  if(dnd){
    // D&D：优劣势只作用于 d20 项，其余骰正常投一次
    out.forEach(g => {
      if(g.sides === 20){ g.tries = [rollOnce(g), rollOnce(g)]; }
      else { g.tries = [rollOnce(g)]; }
    });
    out.forEach(g => {
      if(g.tries.length === 2){
        const hi = sumArr(g.tries[0]) >= sumArr(g.tries[1]) ? 0 : 1;
        const lo = 1 - hi;
        g.keptIdx = mode === 'adv' ? hi : lo;
      } else g.keptIdx = 0;
      g.kept = g.tries[g.keptIdx];
    });
    return out;
  }
  // 通用 / COC / DH / FU：整条指令连投两次，按整条总和取高 / 低
  const t1 = out.map(rollOnce), t2 = out.map(rollOnce);
  const s1 = t1.reduce((a, r) => a + sumArr(r), 0), s2 = t2.reduce((a, r) => a + sumArr(r), 0);
  const pick = mode === 'adv' ? (s1 >= s2 ? 0 : 1) : (s1 <= s2 ? 0 : 1);
  out.forEach((g, i) => { g.tries = [t1[i], t2[i]]; g.keptIdx = pick; g.kept = g.tries[pick]; });
  return out;
}

/* 百分骰 rollPercent() —— COC 包里唯一需要新写的掷骰逻辑（v1.2 §6.2）
 * 机制：十位骰若干 + 共用个位骰。奖励骰取十位**最低**、惩罚骰取十位**最高**。
 * net > 0 = 奖励骰 n 个；net < 0 = 惩罚骰 n 个；0 = 不额外投（奖惩相抵后）。
 * 十位 0 配个位 0 = 100（COC 的 00+0），这是规则本身的特性，照做。
 */
function rollPercent(net){
  const extra = Math.min(Math.abs(net), 8);            // 上限 8 颗，防刷屏
  const kind = net > 0 ? 'bonus' : (net < 0 ? 'penalty' : null);
  const tens = [RNG.die(10) - 1];
  for(let i = 0; i < extra; i++) tens.push(RNG.die(10) - 1);
  const ones = RNG.die(10) - 1;
  let pick = 0;
  if(kind === 'bonus') tens.forEach((t, i) => { if(t < tens[pick]) pick = i; });
  if(kind === 'penalty') tens.forEach((t, i) => { if(t > tens[pick]) pick = i; });
  const t = tens[pick];
  const value = (t === 0 && ones === 0) ? 100 : t * 10 + ones;
  return {tens, ones, pick, kind, value};
}
// COC 五级成功等级（v1.2 §6.2 + 档案验收样例：技能 60 掷 23 → 困难成功；01 → 大成功；100 → 大失败）
function judgeCoc(value, skill){
  const hard = Math.floor(skill / 2), extreme = Math.floor(skill / 5);
  if(value === 100) return {ok:false, crit:true, tone:'critfail', text:'大失败（100）', why:'掷出 100 —— 大失败，事态恶化'};
  if(value >= 96 && skill < 50) return {ok:false, crit:true, tone:'critfail', text:'大失败（96–100）', why:'掷出 ' + value + ' —— 技能 <50 时 96–100 为大失败'};
  if(value === 1) return {ok:true, crit:true, tone:'crit', text:'大成功（01）', why:'掷出 01 —— 大成功'};
  if(value <= 5 && skill >= 50) return {ok:true, crit:true, tone:'crit', text:'大成功（01–05）', why:'掷出 ' + String(value).padStart(2,'0') + ' —— 技能 ≥50 时 01–05 为大成功'};
  if(value <= extreme) return {ok:true, text:'极难成功（≤' + extreme + '）', why:'≤ 技能值的 1/5（' + extreme + '）：极难成功'};
  if(value <= hard) return {ok:true, text:'困难成功（≤' + hard + '）', why:'≤ 技能值的 1/2（' + hard + '）：困难成功'};
  if(value <= skill) return {ok:true, text:'成功（≤' + skill + '）', why:'≤ 技能值 ' + skill + '：成功'};
  return {ok:false, text:'失败（>' + skill + '）', why:'> 技能值 ' + skill + '：失败'};
}
// COC 技能查询：先查别名表（中英文），再查卡上自定义键 —— 开放列表的核心
function lookupCocSkill(name, card){
  const e = lookupAlias(CHECK_DOMAIN.coc7, name);
  if(e) return {key:e.key, zh:e.key, known:true};
  if(card && card.data){
    const k = normToken(name);
    for(const ck in card.data){ if(normToken(ck) === k) return {key:ck, zh:ck, known:false}; }
  }
  return null;
}

 * 六特性调整值范围 −1 ~ +3；动作掷骰 = 希望骰 d12 + 恐惧骰 d12 (+ 调整值)。
 * Hope/Fear 判定**只看两颗 d12**，优劣势加减的 d6 不参与比较（v1.2 §7.2）。
 */
const DH_TRAITS = [
  {key:'agi', zh:'敏捷', en:'agility',   abbr:'agi', aliases:['agi','agility','敏捷']},

registerAliases(CHECK_DOMAIN.dh, DH_TRAITS.map(t => ({key:t.key, kind:'trait', zh:t.zh, en:t.en, abbr:t.abbr, display:t.zh, aliases:t.aliases})));
function judgeDh(hope, fear, total, dc){
  if(hope === fear){
    return {ok:true, crit:true, tone:'crit', text:'关键成功！—— 双骰同点，必定成功',
            why:'✨ 双骰同点（' + hope + '）—— 关键成功：即使低于难度也必定成功，获得 1 希望点，可清除 1 压力点'};
  }
  const hopeSide = hope > fear;
  // ★ 四象限的**中文说法**统一为「希望/恐惧 + 成功/失败」（社区惯用）。
  //   早期写成「成功带希望」是英文 "success with hope" 的直译，读着别扭且不利于口头报点。
  const side = hopeSide ? '希望' : '恐惧';
  const cmp = '　·　希望骰 ' + hope + (hopeSide ? ' > ' : ' < ') + '恐惧骰 ' + fear;
  if(dc == null){
    return {ok:null, tone:'mid', text:'未判难度 · ' + side,
            why:'未给难度，只掷不判：合计 ' + total + cmp};
  }
  const ok = total >= dc;
  const why = '合计 ' + total + ' vs 难度 ' + dc + cmp;
  if(ok && hopeSide)     return {ok:true,  tone:'ok',  text:'希望成功 —— 你获得 1 希望点', why};
  if(ok && !hopeSide)    return {ok:true,  tone:'mid', text:'恐惧成功 —— GM 获得 1 恐惧点', why};
  if(!ok && hopeSide)    return {ok:false, tone:'mid', text:'希望失败 —— 你获得 1 希望点', why};
  return {ok:false, tone:'no', text:'恐惧失败 —— GM 获得 1 恐惧点', why};
}

/* ---------- 5.4 fu.js：最终物语（骰阶 · HR · 暴击 / 失手） ----------
 * 四属性各持一个骰阶 d6 / d8 / d10 / d12；检定掷两骰求和 vs 难度 DL。
 * HR = 两骰较高者（攻击伤害用）；双骰同点且 ≥6 = 暴击；双 1 = 失手。
 */
const FU_ATTRS = [
  {key:'dex', zh:'敏捷', en:'dex', aliases:['dex','敏捷','dexterity']},
  {key:'ins', zh:'洞察', en:'ins', aliases:['ins','洞察','insight']},
  {key:'mig', zh:'力量', en:'mig', aliases:['mig','力量','might']},
  {key:'wlp', zh:'意志', en:'wlp', aliases:['wlp','意志','willpower','will']}
];
const FU_TIERS = [6, 8, 10, 12];
const FU_DL_HINT = {7:'易', 10:'普通', 13:'困难', 16:'极难'};
// ★ 静态备忘字段（与 COC 的 hp / san 同一机制）：只显示、只手改，骰娘不自动增减。
//   物资点 IP / 物语点 FP 在 FU 里是**资源**，纳入追踪会破坏"掷骰是纯函数"（指令集 §10.1），
//   所以做成备忘：玩家自己 .st set 物语点 3 改，骰娘照显示。
const FU_MEMO = [
  {key:'fp', zh:'物语点', en:'fp', aliases:['fp','物语点','fabulapoint','fabula','fp点']},
  {key:'ip', zh:'物资点', en:'ip', aliases:['ip','物资点','inventorypoint','inventory','ip点']}
];
const FU_MEMO_KEYS = new Set(FU_MEMO.map(m => m.key));
registerAliases(CHECK_DOMAIN.fu, FU_ATTRS.map(a => ({key:a.key, kind:'fuattr', zh:a.zh, en:a.en, display:a.zh, aliases:a.aliases})));
registerAliases(CARD_DOMAIN.fu, FU_MEMO.map(m => ({key:m.key, kind:'fumemo', zh:m.zh, en:m.en, display:m.zh, aliases:m.aliases})));
function fuMemoLabel(key){ const m = FU_MEMO.find(x => x.key === key); return m ? m.zh : key; }
function judgeFu(v1, v2, dl, mod){
  mod = mod || 0;
  const sum = v1 + v2 + mod, hr = Math.max(v1, v2);
  if(v1 === 1 && v2 === 1) return {ok:false, crit:true, tone:'critfail', text:'失手！—— 双 1，失败且事态恶化',
    why:'💀 双骰都是 1 —— 失手：必定失败且事态恶化，获得 1 物语点'};
  if(v1 === v2 && v1 >= 6) return {ok:true, crit:true, tone:'crit', text:'暴击！—— 双骰同点且 ≥6',
    why:'✨ 双骰同点 ' + v1 + ' 且 ≥6 —— 暴击：无视难度必定成功，获得 1 次机会'};
  // ★ 调整值是**指令里显式给的**（.fu dex ins 10 +2），不是卡上的状态 —— 不改纯函数性质。
  //   暴击 / 失手只看骰面本身，调整值只影响"合计 vs DL"这一处比较，所以加它不影响判定分支。
  const adjNote = (mod) ? ('（骰点 ' + (sum - mod) + ' ' + (mod > 0 ? '+' : '−') + ' ' + Math.abs(mod) + '）') : '';
  if(dl == null) return {ok:null, tone:'mid', text:'合计 ' + sum + ' · HR ' + hr, why:'未给难度，只掷不判' + adjNote};
  return {ok:sum >= dl, text:(sum >= dl ? '成功' : '失败') + '（合计 ' + sum + ' vs DL ' + dl + '）',
          why:'合计 ' + sum + ' vs 难度 ' + dl + (FU_DL_HINT[dl] ? '（' + FU_DL_HINT[dl] + '）' : '') + adjNote};
}
// 骰阶字面量：d6 / d8 / d10 / d12（必须带 d，否则 "10" 会被当成难度）
function parseTier(tok){
  const m = String(tok == null ? '' : tok).match(/^d(\d+)$/i);
  if(!m) return null;
  const s = parseInt(m[1], 10);
  return FU_TIERS.indexOf(s) >= 0 ? s : null;
}

// 检定目标（属性或技能）统一查询。**必须带 ruleKey** —— 不同规则的键在不同域里
function lookupCheckTarget(name, ruleKey){
  const dom = checkDomainOf(ruleKey);
  return dom ? lookupAlias(dom, name) : null;
}
// 兼容旧调用形态（M1 遗留）。★ M2 分域后这个函数一度断掉 —— 它不带 ruleKey，
// 而 lookupCheckTarget 少了 ruleKey 就查不到任何域，静默返回 null（M1 单测捕获）。
// 旧调用方问的一定是 D&D，所以显式钉死 dnd 域：**兼容层要么能正常工作，要么删掉，
// 不能留一个永远返回 null 的活死人**。
function lookupSkillOrAbility(name){
  const e = lookupCheckTarget(name, 'dnd5e');
  if(!e) return null;
  return e.kind === 'ability' ? {type:'ability', ab:e.ab} : {type:'skill', ab:e.ab, skill:{zh:e.zh, en:e.en, abbr:e.abbr, ab:e.ab}};
}

/* ---------- 5.5 rulepack.js：规则包能力接口 ----------
 * 为什么单独抽一层：`.rc list` 这类"规则相关查询"原先写在主流程里、硬编码 DND_SKILLS。
 * M2 加 COC / 匕首心 / 最终物语 时，要么在主流程堆 if-else，要么每加一包改一次主流程 —— 都会烂。
 * 现在：查询挂规则包，主流程只调 rulePack(key).xxx()。**加新包 = 加一个对象，主流程一行不动**。
 *
 * ★ M2 扩展后的包接口（每套规则各自实现，缺则兜底）：
 *   family          —— 角色卡族（决定卡能不能用）
 *   supportsCheck   —— 支持 .rc 检定类指令吗
 *   needsCard       —— 检定必须先绑卡吗（COC/D&D 是；DH/FU 可用字面骰阶/默认 0 直接掷）
 *   checkHint()     —— .rc 无参数时的一行用法
 *   listChecks(ruleKey, card) —— .rc list 的内容（defs 结构）
 *   checkOffNote(ruleKey)     —— 不支持检定时的提示（null = 支持）
 *   cardTemplate()  —— 无卡时 .st 给的模板（null = 本规则没有卡）★M2 新增
 *   parseCard(rest) —— .st set 的解析：{data, errs, count} ★M2 新增
 *   renderCard(card)—— 卡渲染（栅格 HTML）★M2 新增
 *   runCheck({args, mode, card, ruleKey, me}) —— ★M2 新增：检定逻辑**写在包里**
 *                     返回 {view} 或 {notice:html}。主流程不认识任何规则的判定。
 *   verbs           —— ★M2 新增：规则专属动词（.dh / .fu）的处理函数表
 */

  },

  cardExtra(card){
    const lv = card.data.lv, prof = profFromLv(lv);
    return '<div class="stline" style="margin-top:6px">' + (prof != null
      ? '熟练加值 <b>' + fmtMod(prof) + '</b>（由等级 ' + lv + ' 推导）　·　用 <b>.rc &lt;技能&gt; 熟练</b> 才计入'
      : '熟练加值 —（未设等级，用 <b>.st set lv 5</b> 设置）') + '</div>';
  },
  // ★ 检定逻辑搬进包里（M2）：主流程只负责"卡片族对不对 + 把 view 发出去"
  runCheck({args, mode, card, ruleKey}){
    const tokens = args.split(/\s+/).filter(Boolean);
    let name = null, dc = null, useProf = false, bad = null, wantDc = false;
    tokens.forEach(t => {
      const nt = normToken(t);
      if(!wantDc && /^\d+$/.test(nt)){ dc = parseInt(nt, 10); return; }
      if(lookupAlias('prof', nt)){ useProf = true; return; }
      const m = nt.match(/^(?:dc|难度|困难)(\d+)$/);
      if(m){ dc = parseInt(m[1], 10); return; }
      if(nt === 'dc' || nt === '难度' || nt === '困难'){ wantDc = true; return; }   // 下一个数字即难度
      if(name === null) name = t; else bad = t;
    });
    if(bad) return {notice:'参数太多：「' + esc(bad) + '」。格式：.rc <属性或技能> [难度] [熟练]'};
    const hit = lookupCheckTarget(name, ruleKey);
    if(!hit){
      const s = suggestAlias(checkDomainOf(ruleKey), name, 2);
      return {notice:'未识别「' + esc(name) + '」' + (s.length ? '。你是不是想找：<b>' + s.map(esc).join('</b> / <b>') + '</b>' : '') +
        '<br>属性与技能都认中文，用 <b>.rc list</b> 看全部'};
    }
    const p = parseExpr('1d20');
    const groups = rollGroups(p.groups, mode, ruleKey);
    const diceSum = sumKept(groups);
    const comps = [];
    const abMod = cardMod(card, hit.ab);
    comps.push({label:(hit.kind === 'skill' ? hit.zh + '（' + ABIL_ZH[hit.ab] + '）' : ABIL_ZH[hit.ab]) + '调整值', v:abMod});
    const prof = profFromLv(card.data.lv);
    if(useProf){
      if(prof == null) return {notice:'尚未设置等级，无法计入熟练加值。请用 <b>.st set lv 5</b> 设置等级，或去掉 p 直接检定。'};
      comps.push({label:'熟练加值', v:prof});
    }
    const t = buildTotal(diceSum, comps);
    const nat = natOf(groups, diceSum);
    const verdict = judgeDnd(t.total, dc, nat, ruleKey);
    const nm = natMarkOf(nat, ruleKey);
    const notes = [];
    if(hit.kind === 'skill' && prof != null && !useProf) notes.push('熟练加值 ' + fmtMod(prof) + ' 未计入，若熟练请用 .rc ' + hit.zh + ' p');
    const title = hit.kind === 'skill'
      ? hit.zh + '检定（' + ABIL_ZH[hit.ab] + (useProf ? ' · 含熟练' : '') + '）'
      : ABIL_ZH[hit.ab] + '检定' + (useProf ? '（含熟练）' : '');
    return {view:{ruleKey, mode, groups, comps, diceSum:t.diceSum, add:t.add, total:t.total,
      title, dc, dcLabel:'DC', verdict, natBadge:(nm && nm.badge) || null, natNote:(nm && nm.note) || null, notes}};
  },
  listChecks(ruleKey){
    const byAb = {};
    DND_SKILLS.forEach(s => { (byAb[s.ab] = byAb[s.ab] || []).push(s.zh); });
    return {title:'📜 D&D 检定可用的名字（中英文都认）', sections:[
      {h:'六属性（直接打中文即可）', rows:ABIL_KEYS.map(k => ({
        k:ABIL_ZH[k] + ' / ' + k.toUpperCase(), v:ABIL_ZH[k] + '检定：1d20 + ' + ABIL_ZH[k] + '调整值'
      }))},
      {h:'18 项技能（按属性分组）', rows:ABIL_KEYS.filter(k => byAb[k]).map(k => ({
        k:ABIL_ZH[k], v:byAb[k].join(' / ')
      }))}
    ], foot:[
      '用法：.rc 力量　·　.rc 巧手 熟练　·　.rc 察觉 15 熟练',
      '⚠️ 威吓简写是 inti，不能写成 int（int 是智力）',
      '⚠️ 感知是 WIS 属性；想掷 Perception 请打「察觉」',
      'ℹ️ 本表由 <b>D&D 规则包</b>提供；切到别的规则后，同一条 .rc list 会给出那套规则的表'
    ]};
  }
};

const COC_PACK = {
  family:'coc7',
  supportsCheck:true,
  needsCard:true,
  checkHint(){ return '用法：<b>.rc 侦查</b>　·　<b>.rc 侦查 +1</b>（1 奖励骰）　·　<b>.rc 侦查 -2</b>（2 惩罚骰）　·　<b>.rc list</b> 看卡上技能'; },
  checkOffNote(){ return null; },
  noCardNote(){
    return '尚未绑定角色卡 —— 先用 <b>.st set 侦查 60 图书馆 50 心理学 40</b> 绑定（技能名 + 数值，任意增减），' +
           '再 <b>.rc 侦查</b>；或直接用 <b>.r 1d100</b> 裸掷。';
  },
  cardTemplate(){
    return {title:'尚未绑定角色卡', sections:[
      {h:'复制下面这行、改成自己的技能后发送即可', rows:[
        {k:'.st set 侦查 60 图书馆 50 心理学 40 hp 12 san 70', v:'格式：技能名 数值，空格分隔，可任意增减技能'}
      ]},
      {h:'这张卡的两条规则', rows:[
        {k:'技能表是开放的', v:'想加什么就写什么：<b>.st set 开锁 30 手枪 45</b> —— 不在常用表里的名字也照收，原样进卡'},
        {k:'hp / san 是备忘', v:'只作显示，骰娘<b>不会自动增减</b>；变化请自己 <b>.st set san 65</b> 改'}
      ]}
    ], foot:['★ COC 检定 = 掷 1d100 ≤ 技能值；奖惩骰见 <b>.help coc</b>']};
  },
  parseCard(rest){
    const t = rest.trim().split(/\s+/).filter(Boolean);
    const data = {}, errs = [];
    for(let i = 0; i < t.length; i += 2){
      const raw = t[i];
      const e = lookupAlias(CARD_DOMAIN.coc7, raw);
      const key = e ? e.key : raw;                 // 未注册的自定义技能：原样作键（开放列表）
      const val = t[i + 1];
      if(!/^\d+$/.test(val == null ? '' : val)){ errs.push('「' + raw + '」后面需要一个非负整数'); i -= 1; continue; }
      const v = parseInt(val, 10);
      if(COC_MEMO.has(key)){ if(v > 999){ errs.push(key.toUpperCase() + ' 需在 0–999'); continue; } }
      else if(v < 1 || v > 99){ errs.push('「' + key + '」需在 1–99'); continue; }
      data[key] = v;
    }
    return {data, errs, count:Object.keys(data).length};
  },
  renderCard(card){
    const keys = Object.keys(card.data).filter(k => !COC_MEMO.has(k));
    const memo = Object.keys(card.data).filter(k => COC_MEMO.has(k));
    const cells = keys.slice(0, 24).map(k =>
      '<div class="cell"><span class="ck">' + esc(k) + '</span> <span class="cv">' + card.data[k] + '</span></div>').join('');
    const memoHtml = memo.length
      ? '<div class="stline" style="margin-top:6px">' + memo.map(k => esc(k.toUpperCase()) + ' ' + card.data[k]).join('　·　') +
        '　<span class="ck">（备忘值，骰娘不自动增减）</span></div>'
      : '';
    return (cells ? '<div class="card">' + cells + '</div>' : '<div class="stline">（卡上还没有技能）</div>') +
      memoHtml + (keys.length > 24 ? '<div class="stline">… 共 ' + keys.length + ' 项</div>' : '');
  },
  listChecks(ruleKey, card){
    if(card && card.family === 'coc7' && Object.keys(card.data).length){
      const keys = Object.keys(card.data).filter(k => !COC_MEMO.has(k));
      return {title:'📜 你卡上的技能（COC 7th）', sections:[
        {h:'已绑定 ' + keys.length + ' 项 · 直接 .rc 名字即可掷', rows:keys.slice(0, 18).map(k => ({
          k:esc(k), v:'<b>.rc ' + esc(k) + '</b>　·　奖惩骰 <b>.rc ' + esc(k) + ' +1</b>'
        }))}
      ], foot:[
        '技能表是开放的：想加就 <b>.st set 开锁 30</b>，不用管表里有没有',
        '未绑的技能不能直接掷 —— 先 <b>.st set 名字 数值</b>，或 <b>.r 1d100</b> 裸掷'
      ]};
    }
    return {title:'📜 COC 检定 · 本规则怎么用', sections:[
      {h:'还没有卡：先绑一张', rows:[
        {k:'.st set 侦查 60 图书馆 50 心理学 40 hp 12 san 70', v:'技能名 数值，任意增减；绑完再看 .rc list 会列出你自己的技能'}
      ]},
      {h:'常用技能名参考（中英文都认）', rows:[
        {k:'侦查 / 图书馆 / 心理学', v:'spot · library · psychology'},
        {k:'说服 / 威吓 / 潜行',     v:'persuade · intimidate · stealth'},
        {k:'急救 / 医学 / 手枪 / 格斗', v:'firstaid · medicine · handgun · brawl'},
        {k:'幸运 / 灵感 / 意志',      v:'luck · idea · pow　（也常用作检定）'}
      ]}
    ], foot:[
      '★ COC 的技能表是开放列表 —— 上面只是参考，你写什么名字都能进卡',
      'ℹ️ 检定是 1d100 ≤ 技能值；奖惩骰写法 <b>.rc 侦查 +1</b> / <b>.rc 侦查 -2</b>'
    ]};
  },
  runCheck({args, mode, card, ruleKey}){
    const tokens = args.split(/\s+/).filter(Boolean);
    let name = null, bonus = 0, penalty = 0, bad = null;
    tokens.forEach(t => {
      const nt = normToken(t);
      let m = nt.match(/^\+(\d+)$/);
      if(m){ bonus += parseInt(m[1], 10); return; }
      m = nt.match(/^-(\d+)$/);
      if(m){ penalty += parseInt(m[1], 10); return; }
      m = nt.match(/^(?:奖励|奖|bonus|b)(\d*)$/);
      if(m){ bonus += (m[1] ? parseInt(m[1], 10) : 1); return; }
      m = nt.match(/^(?:惩罚|罚|penalty)(\d*)$/);
      if(m){ penalty += (m[1] ? parseInt(m[1], 10) : 1); return; }
      if(name === null) name = t; else bad = t;
    });
    if(bad) return {notice:'参数太多：「' + esc(bad) + '」。格式：.rc <技能名> [+奖励骰] [-惩罚骰]'};
    if(!name) return {notice:'请给出技能名，例如 <b>.rc 侦查</b>；奖惩骰写法 <b>.rc 侦查 +1</b>'};
    const hit = lookupCocSkill(name, card);
    if(!hit){
      const s = suggestAlias(checkDomainOf(ruleKey), name, 2);
      return {notice:'卡上没有「' + esc(name) + '」' + (s.length ? '。你是不是想找：<b>' + s.map(esc).join('</b> / <b>') + '</b>' : '') +
        '<br>用 <b>.st set ' + esc(name) + ' 60</b> 添加，或直接 <b>.r 1d100</b> 裸掷'};
    }
    const skill = card.data[hit.key];
    if(typeof skill !== 'number') return {notice:'卡上还没有「' + esc(hit.key) + '」的数值 —— 用 <b>.st set ' + esc(hit.key) + ' 60</b> 添加，或直接 <b>.r 1d100</b> 裸掷'};
    const net = bonus - penalty;
    const pc = rollPercent(net);
    // 百分骰：一个 group + percent 描述（十位骰列表 / 个位 / 采用哪一颗），渲染层据此特殊排版
    const groups = [{n:1, sides:100, sign:1, tries:[[pc.value]], kept:[pc.value], keptIdx:0,
      label:'百分骰', percent:{tens:pc.tens, ones:pc.ones, pick:pc.pick, kind:pc.kind}}];
    const t = buildTotal(pc.value, []);
    const verdict = judgeCoc(pc.value, skill);
    const notes = [];
    if(pc.tens.length > 1) notes.push((pc.kind === 'bonus' ? '奖励骰' : '惩罚骰') + ' ×' + Math.abs(net) +
      '：十位骰 ' + pc.tens.join(' / ') + '，取' + (pc.kind === 'bonus' ? '最低' : '最高') + ' ' + pc.tens[pc.pick]);
    else if(bonus && penalty) notes.push('奖 ' + bonus + ' 罚 ' + penalty + ' 相抵，不额外投十位骰');
    if(pc.value === 100) notes.push('十位 00 + 个位 0 = 100');
    if(COC_MEMO.has(hit.key)) notes.push('「' + esc(hit.key.toUpperCase()) + '」是备忘字段 —— 骰娘不会自动增减，只按卡上的数值检定');
    let tag = '';
    if(bonus && penalty) tag = ' [奖' + bonus + ' 罚' + penalty + (net === 0 ? ' · 相抵' : (net > 0 ? ' → 净奖励 ' + net : ' → 净惩罚 ' + (-net))) + ']';
    else if(bonus) tag = ' [奖励骰 ×' + bonus + ']';
    else if(penalty) tag = ' [惩罚骰 ×' + penalty + ']';
    return {view:{ruleKey, mode:null, groups, comps:[], diceSum:t.diceSum, add:t.add, total:t.total,
      title:hit.zh + '检定（' + skill + '）' + tag,
      dc:skill, dcLabel:'技能值', verdict, natBadge:null, natNote:verdict.why || null, notes}};
  }
};

    ], foot:['不绑卡也能掷 —— <b>.dh 15</b> 按调整值 0 计算；绑了卡可以 <b>.dh 敏捷 15</b> 取特性调整值']};
  },
  parseCard(rest){
    const t = rest.trim().split(/\s+/).filter(Boolean);
    const data = {}, errs = [];
    for(let i = 0; i < t.length; i += 2){
      const e = lookupAlias(CARD_DOMAIN.dh, t[i]);
      const val = t[i + 1];
      if(!e){ errs.push('未知特性「' + t[i] + '」'); i -= 1; continue; }
      if(!/^[+-]?\d+$/.test(val == null ? '' : val)){ errs.push('「' + e.display + '」需要整数'); i -= 1; continue; }
      const v = parseInt(val, 10);
      if(v < -1 || v > 3){ errs.push(e.display + '调整值需在 −1 ~ +3'); continue; }
      data[e.key] = v;
    }
    return {data, errs, count:Object.keys(data).length};
  },
  renderCard(card){
    return '<div class="card">' + DH_TRAITS.map(t => {
      const v = card.data[t.key];
      return '<div class="cell"><span class="ck">' + t.zh + '</span> <span class="cv">' + (typeof v === 'number' ? fmtMod(v) : '—') + '</span> ' +
        '<span class="cm">' + esc(t.en) + '</span></div>';
    }).join('') + '</div>';
  },
  listChecks(ruleKey, card){
    const rows = DH_TRAITS.map(t => ({
      k:t.zh + ' / ' + t.abbr.toUpperCase(),
      v:esc(t.en) + '　·　卡上：' + (card && card.family === 'dh' && typeof card.data[t.key] === 'number' ? fmtMod(card.data[t.key]) : '—') +
        '　·　<b>.dh ' + t.zh + ' 15</b>'
    }));
    return {title:'📜 匕首心 · 六特性（本规则不用 .rc）', sections:[
      {h:'六特性调整值（−1 ~ +3）', rows}
    ], foot:[
      '★ 匕首心没有属性检定 —— 动作掷骰请用 <b>.dh 敏捷 15</b>（特性在前、难度在后；可带优势 / +调整值）',
      'ℹ️ 想换特性调整值：<b>.st set 敏捷 2 力量 2 灵巧 1 本能 0 风度 1 知识 -1</b>'
    ]};
  },
  verbs:{
    dh(args, ctx){
      const card = ctx.card, ruleKey = ctx.ruleKey;
      const tokens = args.split(/\s+/).filter(Boolean);
      let dc = null, mode = null, trait = null, flat = 0, bad = null, wantDc = false;
      tokens.forEach(t => {
        const md = lookupAlias('mode', t);
        if(md){ mode = md.key; return; }
        const nt = normToken(t);
        let m = nt.match(/^(?:dc|难度|dl|困难)(\d+)$/);
        if(m){ dc = parseInt(m[1], 10); wantDc = false; return; }
        if(nt === 'dc' || nt === '难度' || nt === '困难' || nt === 'dl'){ wantDc = true; return; }
        if(wantDc && /^\d+$/.test(nt)){ dc = parseInt(nt, 10); wantDc = false; return; }
        m = nt.match(/^([+-])(\d+)$/);
        if(m){ flat += parseInt(m[2], 10) * (m[1] === '-' ? -1 : 1); return; }
        const tr = lookupAlias(CHECK_DOMAIN.dh, t);
        if(tr){ if(trait) bad = t; else trait = tr; return; }
        if(/^\d+$/.test(nt)){ dc = parseInt(nt, 10); return; }
        bad = t;
      });
      if(bad) return {notice:'参数看不懂：「' + esc(bad) + '」。格式：<b>.dh 敏捷 15</b>（特性 → 难度 → 调整值/优劣势，顺序随意）'};
      const hope = RNG.die(12), fear = RNG.die(12);
      const groups = [
        {n:1, sides:12, sign:1, tries:[[hope]], kept:[hope], keptIdx:0, label:'希望骰 d12', chip:'希望'},
        {n:1, sides:12, sign:1, tries:[[fear]], kept:[fear], keptIdx:0, label:'恐惧骰 d12', chip:'恐惧'}
      ];
      if(mode){
        const d6 = RNG.die(6);
        groups.push({n:1, sides:6, sign:(mode === 'adv' ? 1 : -1), tries:[[d6]], kept:[d6], keptIdx:0,
          label:(mode === 'adv' ? '优势骰 d6' : '劣势骰 d6'), chip:(mode === 'adv' ? '优势' : '劣势')});
      }
      const diceSum = sumKept(groups);
      const comps = [], notes = [];
      let traitMod = 0;
      if(trait){
        const v = card ? card.data[trait.key] : undefined;
        if(typeof v === 'number') traitMod = v;
        else notes.push('尚未绑定角色卡（或卡上没有「' + esc(trait.zh) + '」），其调整值按 <b>0</b> 计算 —— 用 <b>.st set ' + esc(trait.zh) + ' 2</b> 设置');
      }
      const mod = traitMod + flat;
      if(mod) comps.push({label:'调整值' + (trait ? '（' + esc(trait.zh) + '）' : ''), v:mod});
      const t = buildTotal(diceSum, comps);
      const verdict = judgeDh(hope, fear, t.total, dc);
      if(verdict.why) notes.push(verdict.why);
      if(mode) notes.push((mode === 'adv' ? '优势' : '劣势') + '：额外 ' + (mode === 'adv' ? '+1d6' : '−1d6') +
        ' 计入总和；Hope / Fear 判定只看两颗 d12');
      const title = '动作掷骰' + (trait ? '（' + esc(trait.zh) + '）' : '') + (dc != null ? ' vs 难度 ' + dc : '');
      return {view:{ruleKey, mode, groups, comps, diceSum:t.diceSum, add:t.add, total:t.total,
        title, dc, dcLabel:'难度', verdict, natBadge:null, natNote:null, notes}};
    }
  }
};

/* ---------- 最终物语包 ---------- */
const FU_PACK = {
  family:'fu',
  supportsCheck:false,
  needsCard:false,
  checkHint(){ return '最终物语不用 .rc —— 检定请用 <b>.fu dex ins 10</b>　·　<b>.fu d8 d10 10</b>　·　<b>.fu dex ins</b>（不判难度）'; },
  checkOffNote(ruleKey){
    return '当前规则为「' + esc(RULE_META[ruleKey].name) + '」，检定用<b>两颗属性骰求和</b>而不是 .rc —— 请用 <b>.fu dex ins 10</b>；属性与骰阶清单见 <b>.rc list</b>。';
  },
  cardTemplate(){
    return {title:'尚未绑定角色卡', sections:[
      {h:'复制下面这行、改骰阶后发送即可', rows:[
        {k:'.st set dex d8 ins d10 mig d8 wlp d6', v:'属性顺序：敏捷 洞察 力量 意志（骰阶 d6 / d8 / d10 / d12）'},
        {k:'.st set 敏捷 d8 洞察 d10 力量 d8 意志 d6', v:'同上，中文写法'},
        {k:'.st set 物语点 3 物资点 2', v:'可选：两个备忘值（只记录、骰娘不自动增减）'}
      ]}
    ], foot:['不绑卡也能掷 —— 直接给骰阶：<b>.fu dex ins 10</b>']};
  },
  parseCard(rest){
    const t = rest.trim().split(/\s+/).filter(Boolean);
    const data = {}, errs = [];
    for(let i = 0; i < t.length; i += 2){
      const e = lookupAlias(CARD_DOMAIN.fu, t[i]);
      const val = t[i + 1];
      if(!e){ errs.push('未知属性「' + t[i] + '」（四属性：敏捷 / 洞察 / 力量 / 意志）'); i -= 1; continue; }
      // 备忘字段（物语点 / 物资点）是**整数**，不是骰阶 —— 必须分流，否则 .st set 物语点 3 会被当成骰阶报错
      if(e.kind === 'fumemo'){
        if(!/^\d+$/.test(val == null ? '' : val)){ errs.push('「' + e.display + '」需要非负整数'); i -= 1; continue; }
        const n = parseInt(val, 10);
        if(n > 99){ errs.push('「' + e.display + '」需在 0–99'); continue; }
        data[e.key] = n;
        continue;
      }
      let tier = parseTier(val);
      if(tier == null && /^\d+$/.test(val == null ? '' : val)){
        const n = parseInt(val, 10);
        if(FU_TIERS.indexOf(n) >= 0) tier = n;      // 宽容：写 8 也认，同 d8
      }
      if(tier == null){ errs.push('「' + e.display + '」需要骰阶 d6 / d8 / d10 / d12'); i -= 1; continue; }
      data[e.key] = tier;
    }
    return {data, errs, count:Object.keys(data).length};
  },
  renderCard(card){
    const memo = FU_MEMO.filter(m => typeof card.data[m.key] === 'number');
    const memoHtml = memo.length
      ? '<div class="stline" style="margin-top:6px">' + memo.map(m => esc(m.zh) + ' <b>' + card.data[m.key] + '</b>').join('　·　') +
        '　<span class="ck">（备忘值，骰娘不自动增减 —— 用 <b>.st set 物语点 3</b> 手改）</span></div>'
      : '';
    return '<div class="card">' + FU_ATTRS.map(a => {
      const v = card.data[a.key];
      return '<div class="cell"><span class="ck">' + a.zh + ' ' + a.en.toUpperCase() + '</span> <span class="cv">' +
        (typeof v === 'number' ? 'd' + v : '—') + '</span></div>';
    }).join('') + '</div>' + memoHtml;
  },
  listChecks(ruleKey, card){
    const rows = FU_ATTRS.map(a => ({
      k:a.zh + ' / ' + a.en.toUpperCase(),
      v:'卡上骰阶：' + (card && card.family === 'fu' && typeof card.data[a.key] === 'number' ? 'd' + card.data[a.key] : '—') +
        '　·　<b>.fu ' + a.en + ' ' + a.en + ' 10</b>'
    }));
    return {title:'📜 最终物语 · 四属性（本规则不用 .rc）', sections:[
      {h:'四属性骰阶（d6 / d8 / d10 / d12）', rows},
      {h:'难度参考（DL）', rows:[
        {k:'7',  v:'易'}, {k:'10', v:'普通'}, {k:'13', v:'困难'}, {k:'16', v:'极难'}
      ]}
    ], foot:[
      '★ 最终物语没有属性检定 —— 请用 <b>.fu dex ins 10</b>（两颗属性骰求和 vs DL）',
      'ℹ️ 同一个属性可用两次：<b>.fu dex dex 13</b>　·　不判难度：<b>.fu dex ins</b>',
      'ℹ️ 无卡也能掷，直接给骰阶：<b>.fu d8 d10 10</b>'
    ]};
  },
  verbs:{
    fu(args, ctx){
      const card = ctx.card, ruleKey = ctx.ruleKey;
      const tokens = args.split(/\s+/).filter(Boolean);
      const slots = []; let dl = null, bad = null, modeBad = false, wantDl = false, out = null, mod = 0;
      tokens.forEach(t => {
        if(out) return;
        if(lookupAlias('mode', t)){ modeBad = true; return; }
        const nt = normToken(t);
        // 调整值：+2 / -1（写在指令里，不是卡上的状态 —— 不影响纯函数性质）
        const mm = nt.match(/^([+-])(\d+)$/);
        if(mm){ mod += parseInt(mm[2], 10) * (mm[1] === '-' ? -1 : 1); return; }
        let m = nt.match(/^(?:dl|难度|困难)(\d+)$/);
        if(m){ dl = parseInt(m[1], 10); wantDl = false; return; }
        if(nt === 'dl' || nt === '难度' || nt === '困难'){ wantDl = true; return; }
        if(wantDl && /^\d+$/.test(nt)){ dl = parseInt(nt, 10); wantDl = false; return; }
        const tier = parseTier(t);
        if(tier){ if(slots.length >= 2) bad = t; else slots.push({tier, short:'d' + tier}); return; }
        const at = lookupAlias(CHECK_DOMAIN.fu, t);
        if(at){
          if(slots.length >= 2){ bad = t; return; }
          const v = card ? card.data[at.key] : undefined;
          if(typeof v === 'number') slots.push({tier:v, short:at.en.toUpperCase()});
          else out = {notice:'尚未绑定角色卡（或卡上没有「' + esc(at.zh) + '」的骰阶）—— 用 <b>.st set ' + esc(at.zh) + ' d8</b> 设置，或直接用骰阶 <b>.fu d8 d10 10</b>'};
          return;
        }
        if(/^\d+$/.test(nt)){ dl = parseInt(nt, 10); return; }
        bad = t;
      });
      if(out) return out;
      if(bad) return {notice:'参数看不懂：「' + esc(bad) + '」。格式：.fu <属性1> <属性2> [难度]　例：<b>.fu dex ins 10</b>'};
      if(modeBad) return {notice:'最终物语<b>没有优劣势机制</b> —— 需要重掷请直接再发一次同一条指令（v1 不追踪物语点）'};
      if(slots.length < 2) return {notice:'需要两个骰阶：<b>.fu dex ins 10</b>（属性名或 d8 / d10 都行）'};
      const v1 = RNG.die(slots[0].tier), v2 = RNG.die(slots[1].tier);
      const groups = [
        {n:1, sides:slots[0].tier, sign:1, tries:[[v1]], kept:[v1], keptIdx:0, label:slots[0].short + ' d' + slots[0].tier, chip:slots[0].short},
        {n:1, sides:slots[1].tier, sign:1, tries:[[v2]], kept:[v2], keptIdx:0, label:slots[1].short + ' d' + slots[1].tier, chip:slots[1].short}
      ];
      const comps = [];
      if(mod) comps.push({label:'调整值', v:mod});
      const t = buildTotal(sumKept(groups), comps);
      const verdict = judgeFu(v1, v2, dl, mod);
      const notes = [];
      if(verdict.why) notes.push(verdict.why);
      notes.push('高骰 HR = ' + Math.max(v1, v2) + '（攻击伤害用此值）');
      const title = '检定 ' + slots.map(s => s.short + '(d' + s.tier + ')').join(' + ') +
        (dl != null ? ' vs DL ' + dl : '') + (mod ? (mod > 0 ? ' +' : ' ') + mod : '');
      return {view:{ruleKey, mode:null, groups, comps, diceSum:t.diceSum, add:t.add, total:t.total,
        title, dc:dl, dcLabel:'DL', verdict, natBadge:null, natNote:null, notes}};
    }
  }
};

// ★ 通用 .r 的"降级接管"：DH / FU 的检定参数不是骰表达式（.r 敏捷 15 / .r dex ins 10），
//   以前会撞上"暂不支持该语法（括号/乘除/骰池）"这种毫不相关的报错。
//   只在通用解析失败时接管，合法骰表达式仍走通用掷骰 —— .r 的既有能力一点没少。
//   放在这里而不是塞进 verbs，是因为 verbs 有"打错规则要提示归属"的语义，两者不能混。
DH_PACK.takeOverR = DH_PACK.verbs.dh;
FU_PACK.takeOverR = FU_PACK.verbs.fu;

// ★ 规则包注册表：M2 三包在这里各加一行，主流程不动
const RULE_PACKS = {generic:GENERIC_PACK, dnd5e:DND_PACK, dnd5r:DND_PACK, coc7:COC_PACK, dh:DH_PACK, fu:FU_PACK};
// 族 → 包：角色卡属于"卡自己的族"，渲染一张卡时要按它的族取包，而不是当前房间规则
const FAMILY_PACKS = {dnd:DND_PACK, coc7:COC_PACK, dh:DH_PACK, fu:FU_PACK};
function packOfFamily(fam){ return (fam && FAMILY_PACKS[fam]) || GENERIC_PACK; }
function rulePack(ruleKey){ return packOfFamily(ruleFamily(ruleKey)); }
// 动词归属：某动词是哪个包的专属指令（用于"当前规则下打了别的规则的指令"时给出可执行的下一步）
function verbOwner(verb){
  for(const k in RULE_PACKS){
    const p = RULE_PACKS[k];
    if(p.verbs && p.verbs[verb]) return k;
  }
  return null;
}

/* ---------- 6. view.js：唯一求和入口 + 判定（派生值全部现场推导） ---------- */
function sumKept(groups){
  let s = 0;
  groups.forEach(g => { s += g.sign * sumArr(g.kept); });
  return s;
}
// total 的唯一出处：骰点 + 有序组件表，杜绝"有时进 mod 有时进 check"的双口径
function buildTotal(diceSum, comps){
  const add = comps.reduce((a, c) => a + c.v, 0);
  return {diceSum, add, total: diceSum + add};
}
// nat：只认"单个 d20"，取最终采用的那一颗
function natOf(groups, diceSum){
  if(groups.length !== 1) return null;
  const g = groups[0];
  if(g.sides !== 20 || g.n !== 1 || g.sign !== 1) return null;
  return g.kept[0];
}
// D&D 判定：唯一一套规则差异在这里（5e 与 5.5e 的 nat 语义）
function judgeDnd(total, dc, nat, ruleKey){
  if(ruleKey === 'dnd5r'){
    if(nat === 20) return {ok:true,  text:'大成功（5.5e：掷 20 即成功）', crit:true, force:true};
    if(nat === 1)  return {ok:false, text:'大失败（5.5e：掷 1 即失败）',  crit:true, force:true};
  }
  if(dc == null) return {ok:null, text:'未指定难度'};
  const d = total - dc;
  return {ok:d >= 0, text:(d >= 0 ? '成功（超出 ' + d + '）' : '失败（差 ' + (-d) + '）')};
}
// nat 语义表：d20 的 20 / 1 在**各套规则里含义不同**，必须按规则分别写死。
// 之前只写了 5e 那一支，导致 5.5e 静默、通用规则却冒出 5e 的文案（真机反馈）。
const NAT_MARK = {
  dnd5r: {
    20:{icon:'✨', cls:'crit',     short:'掷 20 · 5.5e 即成功', long:'✨ 掷出 20 —— 5.5e（2024）：掷 20 即成功，对所有 d20 检定生效'},
    1 :{icon:'💀', cls:'critfail', short:'掷 1 · 5.5e 即失败',  long:'💀 掷出 1 —— 5.5e（2024）：掷 1 即失败，对所有 d20 检定生效'}
  },
  dnd5e: {
    20:{icon:'⚡', cls:'mid', short:'掷 20 · 5e 不自动成功', long:'⚡ 掷出 20 —— 5e：技能/属性检定不自动成功，结果照常计算（仅攻击检定与死亡豁免必中）'},
    1 :{icon:'⚡', cls:'mid', short:'掷 1 · 5e 不自动失败',  long:'⚡ 掷出 1 —— 5e：技能/属性检定不自动失败，结果照常计算（仅攻击检定与死亡豁免必败）'}
  }
};
// 返回 {badge:{icon,cls,short}, note} —— badge 进折叠行，note 进展开区。
// ★ 非 D&D 规则（通用 / COC / DH / FU）直接返回 null：既不高亮也不加注。
//   之前"标黄 + 再加一句没有特殊语义"是双重噪音 —— 没有意义的东西就不要提。
function natMarkOf(nat, ruleKey){
  if(nat !== 20 && nat !== 1) return null;
  const t = NAT_MARK[ruleKey];
  if(!t) return null;
  const m = t[nat];
  if(!m) return null;
  return {badge:{icon:m.icon, cls:m.cls, text:m.short}, note:m.long};
}
// 兼容旧调用（.rc 路径）
function natNoteOf(nat, ruleKey, hasDc){
  const m = natMarkOf(nat, ruleKey);
  return m ? m.note : null;
}

/* ---------- 7. render.js：同一份渲染函数（聊天流 / 详情 / 战报共用） ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtMod(v){ return (v >= 0 ? '+' + v : String(v)); }

// nat 语义只在 D&D 规则里存在。通用/COC/DH/FU 掷 d20 出 1 或 20 没有特殊含义 ——
// 标黄 + 加一句"没有特殊语义"是双重噪音（真机反馈），所以这些规则一律不高亮、不加注。
function hasNatSemantics(ruleKey){ return ruleKey === 'dnd5e' || ruleKey === 'dnd5r'; }
function critOf(sides, v, ruleKey){
  if(!hasNatSemantics(ruleKey)) return '';
  return (sides === 20 && (v === 20 || v === 1)) ? ' crit' : '';
}

function allChips(groups, ruleKey){
  return groups.map(g => groupChips(g, ruleKey)).join('<span class="sep">+</span>');
}
// 百分骰（COC）：十位骰若干 + 共用个位骰 —— 未采用的十位划掉，一眼能核验取了哪一颗
function percentChips(g){
  const p = g.percent, out = ['<span class="plab">十位</span>'];
  p.tens.forEach((t, i) => out.push('<span class="chip' + (i === p.pick ? '' : ' drop') + '">' + t + '</span>'));
  out.push('<span class="plab">个位</span>');
  out.push('<span class="chip">' + p.ones + '</span>');
  return out.join('');
}
function groupChips(g, ruleKey){
  if(g.percent) return percentChips(g);
  // 折叠态同样带语义标签（希望 / 恐惧 / DEX / INS）—— 两颗骰并排时没有标签就分不清谁是谁
  const lab = g.chip ? '<span class="plab">' + esc(g.chip) + '</span>' : '';
  const multi = g.tries.length > 1;
  if(!multi) return lab + g.kept.map(v => '<span class="chip' + critOf(g.sides, v, ruleKey) + '">' + v + '</span>').join('');
  const out = [lab];
  g.tries.forEach((tv, i) => {
    const used = i === g.keptIdx;
    tv.forEach(v => out.push('<span class="chip' + (used ? critOf(g.sides, v, ruleKey) : ' drop') + '">' + v + '</span>'));
    if(i < g.tries.length - 1) out.push('<span class="sep">/</span>');
  });
  return out.join('');
}

// 判定色：ok / no / mid / crit / critfail。★ 结论的"色调"由规则包给定（tone），
// 主渲染不猜 —— 「失败带希望」不是纯失败（橙），「成功带恐惧」也不是纯成功。
function toneOf(vd){
  if(!vd) return '';
  if(vd.tone === 'crit') return 'crit';
  if(vd.tone === 'critfail') return 'critfail';
  if(vd.tone === 'mid') return 'mid';
  if(vd.ok === null) return 'mid';
  return vd.ok ? 'ok' : 'no';
}
function renderRoll(m){
  const v = m.view;
  const badge = !v.verdict ? '' :
    '<span class="badge ' + toneOf(v.verdict) + '">' +
       (v.verdict.crit ? (v.verdict.ok ? '✨ ' : '💀 ')
        : (v.verdict.ok === null ? 'ⓘ ' : (v.verdict.ok ? '✅ ' : '❌ '))) + esc(v.verdict.text) + '</span>';
  // nat 徽章：只在"结论没覆盖它"时出现（5.5e 有 DC 时 verdict 已写大成功/大失败，不重复）
  const nb = (!v.natBadge || (v.verdict && v.verdict.crit)) ? '' :
    '<span class="badge ' + v.natBadge.cls + '">' + v.natBadge.icon + ' ' + esc(v.natBadge.text) + '</span>';
  const parts = [];
  parts.push('<div class="row1">');
  parts.push('<span class="caret">▶</span>');
  parts.push('<span class="ttl">' + esc(v.title) + '</span>');
  if(v.mode) parts.push('<span class="mode">' + (v.mode === 'adv' ? '优势' : '劣势') + '</span>');
  parts.push('<span class="chips">' + allChips(v.groups, v.ruleKey) + '</span>');
  parts.push('<span class="sum">→ ' + v.total + '</span>');
  parts.push(badge);
  parts.push(nb);
  parts.push('</div>');

  parts.push('<div class="detail">');
  v.groups.forEach(g => {
    if(g.percent){
      // COC 百分骰：明细必须能看出"十位取了哪颗、个位是多少、怎么合成 1–100"
      const p = g.percent;
      parts.push('<div class="dline use">' +
        '<span class="idx">十位</span>' +
        '<span class="chips">' + p.tens.map((t, i) => '<span class="chip' + (i === p.pick ? '' : ' drop') + '">' + t + '</span>').join('') + '</span>' +
        '<span class="tail">' + (p.tens.length > 1 ? ((p.kind === 'bonus' ? '奖励取低 ' : '惩罚取高 ') + p.tens[p.pick]) : '—') + '</span></div>');
      parts.push('<div class="dline">' +
        '<span class="idx">个位</span>' +
        '<span class="chips"><span class="chip">' + p.ones + '</span></span>' +
        '<span class="tail">' + ((p.tens[p.pick] === 0 && p.ones === 0) ? '十位 00 + 个位 0 = 100' : '→ ' + g.kept[0]) + '</span></div>');
      return;
    }
    const multi = g.tries.length > 1;
    g.tries.forEach((tv, i) => {
      const used = i === g.keptIdx;
      parts.push('<div class="dline' + (used ? ' use' : '') + '">' +
        '<span class="idx">' + (multi ? '第' + (i + 1) + '次' : '') + '</span>' +
        '<span>' + esc(g.label ? g.label : (g.n + 'd' + g.sides)) + '</span>' +
        '<span class="chips">' + tv.map(x => '<span class="chip' + (!used ? ' drop' : critOf(g.sides, x, v.ruleKey)) + '">' + x + '</span>').join('') + '</span>' +
        (multi ? '<span class="tail">' + (used ? '采用 · 骰点 ' + sumArr(tv) : '骰点 ' + sumArr(tv)) + '</span>' : '') +
        '</div>');
    });
  });
  v.comps.forEach(c => parts.push('<div class="dline comp"><span class="idx"></span><span>' + esc(c.label) + ' ' + fmtMod(c.v) + '</span></div>'));
  if(v.natNote) parts.push('<div class="dline nat"><span class="idx"></span><span>' + esc(v.natNote) + '</span></div>');
  if(v.dc != null) parts.push('<div class="dline comp"><span class="idx">' + esc(v.dcLabel || '难度') + '</span><span>' + v.dc + '</span></div>');
  // ★ 没有调整项时就不提"调整项" —— COC 百分骰、FU 两骰求和都不存在调整值这个概念，
  //   恒为 +0 的一行既占版面又暗示"这里可以调"，是噪音。（真机反馈：截图里 + 调整项 +0 被圈出来）
  parts.push('<div class="dline tot"><span class="idx">合计</span><span>' +
    (v.comps && v.comps.length ? ('骰点 ' + v.diceSum + ' + 调整项 ' + fmtMod(v.add) + ' → ' + v.total)
                               : ('骰点 ' + v.diceSum + ' → ' + v.total)) + '</span></div>');
  parts.push('</div>');
  if(v.notes && v.notes.length) parts.push('<div class="note">' + v.notes.map(n => 'ⓘ ' + n).join('<br>') + '</div>');
  return '<div class="bubble dice rule-' + v.ruleKey + '" data-mid="' + m.id + '">' + parts.join('') + '</div>';
}

function renderSys(m){
  return '<div class="sys"><div class="h">' + esc(m.title) + '</div>' +
    '<div class="b1">' + esc(m.line1) + '</div>' +
    '<div class="b2">' + esc(m.line2) + '</div></div>';
}
function renderNotice(m){ return '<div class="notice">ⓘ ' + m.html + '</div>'; }
function renderPre(text){ return '<div class="bubble"><pre>' + esc(text) + '</pre></div>'; }
function renderHtml(html){ return '<div class="bubble">' + html + '</div>'; }

// 指令 / 说明 分栏渲染。v 允许含有限标签（调用方对动态内容自行 esc）
function defsHtml(d){
  let h = '';
  if(d.title) h += '<div class="ht">' + esc(d.title) + '</div>';
  (d.sections || [{rows:d.rows}]).forEach(s => {
    if(s.h) h += '<div class="hs"><div class="hh">' + esc(s.h) + '</div>';
    else h += '<div class="hs">';
    (s.rows || []).forEach(r => {
      h += '<div class="hrow"><span class="hk">' + r.k + '</span><span class="hv">' + r.v + '</span></div>';
    });
    h += '</div>';
  });
  if(d.foot && d.foot.length) h += '<div class="hf">' + d.foot.join('<br>') + '</div>';
  return h;
}
function renderDefs(d){ return '<div class="bubble">' + defsHtml(d) + '</div>'; }
// 角色卡：栅格而非等宽文本，窄屏自动降为 2 列，不会换行错位
function renderCardHtml(card){
  const cells = ['str','dex','con','int','wis','cha'].map(k => {
    const v = card.data[k];
    return '<div class="cell"><span class="ck">' + ABIL_ZH[k] + '</span> ' +
      '<span class="cv">' + (typeof v === 'number' ? v : '—') + '</span> ' +
      '<span class="cm">' + fmtMod(cardMod(card, k)) + '</span></div>';
  }).join('');
  return '<div class="card">' + cells + '</div>';
}
function renderChat(m){ return '<div class="bubble">' + esc(m.text) + '</div>'; }
function renderMsg(m){
  if(m.kind === 'sys') return renderSys(m);
  if(m.kind === 'notice') return renderNotice(m);
  if(m.kind === 'pre') return renderPre(m.text);
  if(m.kind === 'html') return renderHtml(m.html);
  if(m.kind === 'cmd') return '<div class="bubble cmd">' + esc(m.text) + '</div>';
  if(m.kind === 'roll') return renderRoll(m);
  return renderChat(m);
}

      {k:'物语点', v:'不追踪（破坏掷骰的纯函数性质）—— 骰娘只告诉你这次获得了几点；想记就用卡上的备忘字段'},
      {k:'通用命令头', v:'本规则下 <b>.r dex ins 10</b> 等同 <b>.fu dex ins 10</b>；但 <b>.r 2d6+3</b> 仍是通用掷骰'}
    ]}
  ], foot:['ℹ️ 无卡也能掷：直接给骰阶 <b>.fu d8 d10 10</b>']};
}
const HELP_BODY = {generic:helpGeneric, dnd5e:helpDnd, dnd5r:helpDnd, coc7:helpCoc, dh:helpDh, fu:helpFu};

/* ---------- 9. st.js：D&D 角色卡 ---------- */
const CARD_KEYS = ['str','dex','con','int','wis','cha','lv','level'];
// 卡字段同样走别名层：属性直接用 check 域的中文，等级单独一组。
// 域名带族（CARD_DOMAIN.dnd）—— M2 后四套规则各有一张卡字段表，不能共用一个域。
registerAliases(CARD_DOMAIN.dnd,
  DND_ABILITIES.map(a => ({key:a.key, display:a.zh, aliases:a.aliases}))
  .concat([{key:'lv', display:'等级', aliases:['lv','level','等级','级别','lvl','等阶']}])
);
function normalizeCardKey(k){
  const e = lookupAlias(CARD_DOMAIN.dnd, k);
  return e ? e.key : null;
}
function parseCardSet(rest){
  const t = rest.trim().split(/\s+/).filter(Boolean);
  const data = {}; const errs = [];
  for(let i = 0; i < t.length; i += 2){
    const key = normalizeCardKey(t[i]);
    const val = t[i + 1];
    if(!key){ errs.push('未知字段「' + t[i] + '」'); i -= 1; continue; }
    if(!/^-?\d+$/.test(val == null ? '' : val)){ errs.push('「' + key + '」需要整数'); i -= 1; continue; }
    const v = parseInt(val, 10);
    if(key === 'lv'){
      if(v < 1 || v > 20){ errs.push('等级需在 1–20'); continue; }
    } else if(v < 1 || v > 30){ errs.push(ABIL_ZH[key] + '需在 1–30'); continue; }
    data[key] = v;
  }
  return {data, errs, count:Object.keys(data).length};
}
function cardMod(card, ab){
  const s = card && card.data ? card.data[ab] : undefined;
  return typeof s === 'number' ? abilityMod(s) : 0;   // 缺失属性按 10 处理
}
// 角色卡改为栅格渲染 renderCardHtml（见 render 区），等宽文本版已废弃删除 ——
// 窄屏下等宽表格必然换行错位，且两处实现会漂移（原则 4）。

// ★ 角色卡属于「卡自己的规则」，不属于「当前房间规则」—— 这是两个正交维度。
//   之前 .st 用房间规则名当卡名（通用规则下把 D&D 卡叫"通用角色卡"），是张冠李戴。
function cardRuleName(card){
  if(!card) return '';
  if(card.family === 'dnd') return 'D&D';
  return RULE_META[card.family] ? RULE_META[card.family].name : card.family;
}
// 卡与当前规则不匹配时的提示（null = 匹配）。三处共用（.st / .st set / .status），避免各写各的。
function cardMismatchNote(card, ruleKey){
  if(!card) return null;
  if(ruleFamily(ruleKey) === card.family) return null;
  const back = card.family === 'dnd' ? 'dnd' : card.family;
  // ★ 两条出路都要给：① 切回卡所属的规则 ② 解绑后按当前规则重开一张。
  //   只给①的话，玩家想换规则开新卡时不知道怎么把手上这张扔掉（.st 会一直返回旧卡）。
  return '⚠️ 这是 <b>' + esc(cardRuleName(card)) + '</b> 角色卡，当前规则「' + esc(RULE_META[ruleKey].name) +
         '」下不参与检定 —— 用 <b>.set rule ' + esc(back) + '</b> 切回后恢复，' +
         '或用 <b>.st clear</b> 解绑（解绑后再发 <b>.st</b> 就是当前规则的角色卡模板）';
}
