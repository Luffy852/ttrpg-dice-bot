# Cloudflare Workers 配置（带后端 → Workers，不是 Pages；档案 §6.3 已说明适用边界）
name = "ttrpg-dice-bot"
main = "apps/worker/src/index.js"        # 相对于仓库根
compatibility_date = "2026-10-29"

# 前端零构建：原生 ESM 整个目录托管（推荐项 ③）
#
# ★★ run_worker_first = true 是**必需项**，不是优化项 ★★
#   默认行为（run_worker_first = false）：Cloudflare **先找静态资源**，找不到才调 Worker。
#   而 not_found_handling = "single-page-application" 的意思是"找不到的路径一律返回
#   index.html + 200"。WebSocket 握手请求 /ws/123456 在资源目录里当然没有对应文件，
#   于是被当成 SPA 兜底路径 → 返回 200 + index.html。
#   浏览器期待的是 101 Switching Protocols，收到 200 就判定握手失败 → **关闭码 1006**
#   （表现：页面一直"正在重连"、指令永远卡在"发送中"）。
#   设了 run_worker_first = true，Worker 先跑，/ws/ 与 /api/ 被 Worker 接住，
#   其余请求再由 Worker 转给 env.ASSETS，SPA 兜底照常生效。
[assets]
directory = "apps/web"                   # 前端零构建：整个目录托管
binding = "ASSETS"                       # 默认就是 ASSETS，显式写出来避免歧义
not_found_handling = "single-page-application"
run_worker_first = true

# 每个房间一个 DO，SQLite 持久化
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# ★ 免费额度是账户级的（你已有两个工具在跑）：部署后先盯一眼账户总量，别只看骰娘自己
[observability]
enabled = true

# PIN_SECRET 在 Cloudflare 网页端设置（Settings → Variables and Secrets），不进仓库、不进前端

# ★ T1 预览路径（2026-11-11）：Workers Builds 对非生产分支默认执行
#   `npx wrangler preview`（open beta），该命令硬性要求 Wrangler 配置里存在 previews 块。
#   assets / compatibility_date / classes / migrations 保持顶层即可；
#   但「运行时绑定」不继承生产设置，凡代码通过 env.X 读取的都要在本块里再声明一次。
#   ★ 密钥只在 Cloudflare 网页端设置，从不写进本文件。
#   ★ 本块只影响预览构建；wrangler deploy（生产 main）行为不变。
[previews]

# ★★ 预览必须有 ROOM 绑定，否则建房必 500 ★★
#   apps/worker/src/index.js 的 stubOf = (env, code) => env.ROOM.get(env.ROOM.idFromName(code))，
#   是「通过 env 读取」的用法。Previews 不继承顶层 [[durable_objects.bindings]]，
#   空 previews 块会让预览实例拿到 env.ROOM === undefined → POST /api/room 抛异常 → HTTP 500。
#   class_name 与顶层一致；[[migrations]] 保持顶层，Cloudflare 会为每个 Preview
#   自动 provision 独立的 DO namespace（预览房间数据与生产完全隔离）。
#   官方口径：Add previews.durable_objects.bindings only if your code reads the binding from env.
[[previews.durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"
